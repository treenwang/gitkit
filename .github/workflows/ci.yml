name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Typecheck and build run once; they do not depend on the runtime matrix.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # The git version matrix is necessary: the behaviour of sparse-checkout
  # combined with worktrees changes between versions. 2.32 is the floor declared
  # in package.json and has to genuinely pass.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
        git: ['2.32.0', 'system']
    name: node ${{ matrix.node }} / git ${{ matrix.git }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Build git ${{ matrix.git }} from source
        if: matrix.git != 'system'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext libcurl4-openssl-dev libexpat1-dev \
            libssl-dev libz-dev tcl-dev
          curl -fsSL "https://github.com/git/git/archive/refs/tags/v${{ matrix.git }}.tar.gz" \
            | tar -xz
          cd "git-${{ matrix.git }}"
          make prefix=/usr/local -j"$(nproc)" NO_TCLTK=1 NO_GETTEXT=1 all
          sudo make prefix=/usr/local NO_TCLTK=1 NO_GETTEXT=1 install

      - name: Report git version under test
        run: git --version

      - run: npm ci
      # The browser-side package runs in happy-dom, configured by the ui project in vitest.config.ts
      - run: npm test
